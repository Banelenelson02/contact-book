<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Book</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-address-book"></i> Contact Book</h1>
            <p>Manage all your contacts in one place. Add, edit, or delete contacts with ease.</p>
        </header>
        
        <div class="app-container">
            <div class="app-header">
                <div class="app-title">My Contacts</div>
                <div class="controls">
                    <button class="btn btn-primary" id="refreshBtn">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                    <button class="btn btn-success" id="addContactBtn">
                        <i class="fas fa-user-plus"></i> Add Contact
                    </button>
                </div>
            </div>
            
            <div class="contact-list" id="contactList">
                <!-- Contacts will be loaded here -->
                <div class="no-contacts">
                    <i class="fas fa-user-friends"></i>
                    <h3>No Contacts Found</h3>
                    <p>Add your first contact to get started</p>
                </div>
            </div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalContacts">0</div>
                    <div class="stat-label">Total Contacts</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="favoriteContacts">0</div>
                    <div class="stat-label">Favorites</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="recentContacts">0</div>
                    <div class="stat-label">Recently Added</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Contact Modal -->
    <div class="modal" id="contactModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Add New Contact</div>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="avatar-preview" id="avatarPreview">
                    <i class="fas fa-user"></i>
                </div>
                
                <form id="contactForm">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="avatar">Profile Picture</label>
                        <input type="file" id="avatar" accept="image/*">
                    </div>
                    
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="cancelBtn">Cancel</button>
                <button class="btn btn-success" id="saveContactBtn">Save Contact</button>
            </div>
        </div>
    </div>
    
    <!-- Confirmation Modal -->
    <div class="modal" id="confirmationModal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <div class="modal-title">Confirm Contact Details</div>
                <button class="close-modal" id="closeConfirmationModal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="confirmationDetails"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="cancelConfirmation">Edit Details</button>
                <button class="btn btn-success" id="confirmSave">Save Contact</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
